
{% extends 'attendance/base.html' %}

{% block title %}Record Attendance | Attendance System{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Record Student Attendance</h1>
    <p>Select the student, date and attendance status.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Save Attendance
        </button>

        <a href="{% url 'attendance:attendance_list' %}" class="cancel-link">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
