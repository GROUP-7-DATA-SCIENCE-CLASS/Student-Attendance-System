{% extends 'attendance/base.html' %}

{% block title %}Register Student | Attendance System{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Register New Student</h1>
    <p>Enter the student's details below.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Register Student
        </button>

        <a href="{% url 'attendance:student_list' %}" class="cancel-link">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
